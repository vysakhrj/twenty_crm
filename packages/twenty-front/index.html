<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/x-icon"
      href="/inceptra-favicon.png"
      data-rh="true"
    />
    <link rel="apple-touch-icon" href="/inceptra-favicon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#000000" />
    <meta name="description" content="SFS CRM" />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/twentyhq/twenty/main/docs/static/img/social-card.png"
    />
    <meta property="og:description" content="SFS CRM" />
    <meta property="og:title" content="SFS CRM" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/twentyhq/twenty/main/docs/static/img/social-card.png"
    />

    <meta name="twitter:description" content="SFS CRM" />
    <meta name="twitter:title" content="SFS CRM" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600&display=swap"
    />

    <title>SFS CRM</title>
    <!-- BEGIN: Twenty Config -->
    <script id="twenty-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: Twenty Config -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      :root {
        /* THEME_DARK.background.tertiary */
        --theme-dark-background-tertiary: #1d1d1d;
        /* THEME_LIGHT.background.tertiary */
        --theme-light-background-tertiary: #f1f1f1;
      }

      @media (prefers-color-scheme: dark) {
        html, body {
          background-color: var(--theme-dark-background-tertiary);
        }
      }

      @media (prefers-color-scheme: light) {
        html, body {
          background-color: var(--theme-light-background-tertiary);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div
        style="align-items: center; background-color: #1d1d1d; display: flex; height: 100dvh; justify-content: center; margin: 0; width: 100%;"
      >
        <div style="position: relative; height: 48px; width: 48px;">
          <img
            src="/inceptra-favicon.png"
            alt="Loading"
            style="border-radius: 8px; height: 100%; object-fit: cover; position: relative; width: 100%; z-index: 2;"
          />
          <div
            style="animation: skeleton-pulse 1.5s ease-in-out infinite; background: linear-gradient(90deg, rgba(42,42,42,0) 25%, rgba(58,58,58,0.5) 50%, rgba(42,42,42,0) 75%); background-size: 200% 100%; border-radius: 8px; height: 100%; left: 0; position: absolute; top: 0; width: 100%; z-index: 3;"
          ></div>
        </div>
      </div>
    </div>
    <style>
      @keyframes skeleton-pulse {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
